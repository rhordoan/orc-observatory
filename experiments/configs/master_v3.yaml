# Master v3: Saddle-ORC experiment suite
#
# KEY CHANGE from v2: Saddle-ORC fixes the curvature-gap bias where
# min-kappa correlates with max fitness gap (r > -0.95), selecting
# deep-basin neighbors. Pre-filtering to the closest-fitness half
# before ORC selection corrects this.
#
# New algorithms: saddle_orc, saddle_walk
# New domain: graph bisection (planted partition + ER)
# Kept: all v2 algorithms for before/after comparison
#
# ~750 instances across 7 problem domains

experiments:
  - escape
  - otg_features
  - ils
  - scalability

# Escape config
n_random_trials: 30
n_shuffles: 5

# ILS config -- 16 algorithms (v2's 12 + 2 saddle variants + 2 dropped)
algorithms:
  - saddle_orc
  - orc_pert
  - saddle_walk
  - orc_walk
  - boltzmann
  - random
  - rrhc
  - mingap
  - sa
  - tabu
  - ea11
  - vns
  - orc_adaptive
  - orc_sa
budgets: [5000, 20000]
n_trials: 50

