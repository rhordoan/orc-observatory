# Experiment C: TSPLIB + QAPLIB structured instances
experiments:
  - escape
  - otg_lon
  - shuffle
use_gpu: true
gamma: 1.0
strategies: [orc, mingap, random]
n_shuffles: 5
optima_mode: sample
grid:
  items:
    - {type: tsplib, instance: eil51, n_restarts: 800, seeds: [0,1,2,3,4]}
    - {type: tsplib, instance: berlin52, n_restarts: 800, seeds: [0,1,2,3,4]}
    - {type: tsplib, instance: kroA100, n_restarts: 1500, seeds: [0,1,2,3,4]}
    - {type: qaplib, instance: nug12, n_restarts: 600, seeds: [0,1,2,3,4]}
    - {type: qaplib, instance: chr15a, n_restarts: 600, seeds: [0,1,2,3,4]}
    - {type: qaplib, instance: rou20, n_restarts: 800, seeds: [0,1,2,3,4]}
