# Master v2: Three-track experiment suite
#
# Track 1 (ELA for CO): ORC features as universal discrete landscape features
#   - Cross-domain algorithm selection (LODO evaluation)
#   - ORC vs FLA feature importance comparison
#
# Track 2 (Continuous navigation): ORC as real-time search compass
#   - orc_walk: follow min-kappa chain for k steps
#   - orc_adaptive: adapt perturbation from curvature magnitude
#   - orc_sa: curvature-biased simulated annealing
#
# Track 3 (Real-world OR): Structured problems where ORC should dominate
#   - 10 TSPLIB instances (up from 3)
#   - 6 QAPLIB instances (up from 3)
#   - 6 Flowshop instances (new domain)
#   - MAX-SAT instances (already implemented, newly included)
#
# ~680 instances across 6 problem domains

experiments:
  - escape
  - otg_features
  - ils
  - scalability

# Escape config
n_random_trials: 30
n_shuffles: 5

# ILS config -- 12 algorithms including 3 new ORC-navigation variants
algorithms:
  - orc_pert
  - boltzmann
  - random
  - rrhc
  - mingap
  - sa
  - tabu
  - ea11
  - vns
  - orc_walk
  - orc_adaptive
  - orc_sa
budgets: [5000, 20000]
n_trials: 50

