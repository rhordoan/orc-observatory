apiVersion: batch/v1
kind: Job
metadata:
  name: orc-exp-f-portfolio
  namespace: runai-romania-dev
  labels:
    app: orc-experiments
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: orc-exp-f
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-cpu-node-r770
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      containers:
      - name: runner
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - |
          set -ex
          apt-get update && apt-get install -y --no-install-recommends git
          cd /workspace
          git clone https://github.com/rhordoan/orc-observatory.git repo
          cd repo
          pip3 install --no-cache-dir \
            -r requirements.txt \
            -r experiments/requirements-experiments.txt

          echo "=== Phase 2: ILS portfolio on 128 cores ==="
          python3 -m experiments.runner \
            --config experiments/configs/exp_f_selector.yaml \
            --output /results/exp-f-v2

          echo "=== Phase 2: Algorithm selector ==="
          python3 -m experiments.algorithm_selector \
            --features /results/exp-f-v2/otg_features.csv \
            --fla /results/exp-f-v2/fla_features.csv \
            --ils /results/exp-f-v2/ils_comparison.csv \
            --output /results/exp-f-v2

          echo "=== EXP F COMPLETE ==="
          ls -lR /results/exp-f-v2/
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DEBIAN_FRONTEND
          value: "noninteractive"
        resources:
          requests:
            cpu: "128"
            memory: 128Gi
          limits:
            cpu: "128"
            memory: 128Gi
        volumeMounts:
        - name: results
          mountPath: /results
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: results
        persistentVolumeClaim:
          claimName: orc-experiment-results
      - name: workspace
        emptyDir:
          sizeLimit: 10Gi
